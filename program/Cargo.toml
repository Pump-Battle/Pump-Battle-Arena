[package]
name = "arena_pino"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "0.11.2", features = ["cpi"] }
pinocchio-system = "0.6.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
overflow-checks = false
panic = "abort"
strip = true
